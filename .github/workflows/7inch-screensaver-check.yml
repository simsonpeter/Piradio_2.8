name: PiRadio 7-inch ambient screensaver

on:
  push:
    branches:
      - feature/7inch-ambient-screensaver
      - feature/7inch-youtube-unified-controls
      - feature/7inch-guest-cast
      - feature/7inch-youtube-dedicated-player
      - feature/7inch-smart-photo-frame
      - feature/7inch-smart-media-hub-v2
  pull_request:
    paths:
      - touch_radio.py
      - landscape_screensaver.py
      - youtube_video_backend.py
      - landscape_dashboard.py
      - piradio_guest_cast.py
      - landscape_cast.py
      - landscape_youtube_player.py
      - smart_photo_frame.py
      - audio_visualizer.py
      - landscape_audio_visualizer.py
      - bluetooth_reconnect.py
      - tests/test_audio_visualizer.py
      - tests/test_bluetooth_reconnect.py
      - tests/test_photo_frame_pro.py
      - landscape_immersive.py
      - boot/piradio-open
      - boot/tcradios-start
      - install_piradio_app_launcher.sh

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python3 -m py_compile touch_radio.py landscape_screensaver.py weather_service.py youtube_video_backend.py landscape_dashboard.py piradio_guest_cast.py landscape_cast.py landscape_youtube_player.py smart_photo_frame.py landscape_immersive.py landscape_smart_home.py landscape_universal_player.py home_assistant_bridge.py landscape_home_assistant.py audio_visualizer.py landscape_audio_visualizer.py bluetooth_reconnect.py
      - name: Validate PiRadio desktop app launcher without reboot
        run: |
          bash -n boot/tcradios-start boot/piradio-open install_piradio_app_launcher.sh
          TEST_HOME=$(mktemp -d)
          mkdir -p "$TEST_HOME/Desktop"
          HOME="$TEST_HOME" bash install_piradio_app_launcher.sh
          test -x "$TEST_HOME/.local/bin/piradio7"
          test -f "$TEST_HOME/.local/share/applications/piradio7.desktop"
          grep -q 'Name=PiRadio 7' "$TEST_HOME/.local/share/applications/piradio7.desktop"
          HOME="$TEST_HOME" "$TEST_HOME/.local/bin/piradio7" status
          HOME="$TEST_HOME" "$TEST_HOME/.local/bin/piradio7" --help
          HOME="$TEST_HOME" bash install_piradio_app_launcher.sh
          test -x "$TEST_HOME/.local/bin/piradio7"
          echo 'PiRadio desktop app launcher checks passed'
      - name: Create isolated renderer environment
        run: python3 -m venv .venv
      - name: Install Pygame renderer
        run: .venv/bin/python -m pip install pygame==2.6.1 requests flask qrcode[pil] numpy
      - name: Test weather parser and network error handling
        run: .venv/bin/python -m unittest discover -s tests -p 'test_weather_service.py' -v
      - name: Check weather integration
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          source = Path("touch_radio.py").read_text()
          checks = (
              "&current=temperature_2m,relative_humidity_2m,weather_code",
              "def fetch_weather_background(coords, url):",
              "weather_next_check = now + 60",
              "weather_next_check = now + 600",
              "weather_last_error",
              "weather_available",
              "@app.route('/api/weather/refresh', methods=['POST'])",
          )
          for marker in checks:
              assert marker in source, f"Weather integration missing: {marker}"
          print("Weather integration markers found")
          PY
      - name: Test minimized video transport and touchscreen controls
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_youtube_video_controls.py' -v
      - name: Validate active media title on all touchscreen pages
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_universal_media_ui.py' -v
      - name: Test universal 800x480 Now Playing UI
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_universal_player.py' -v
      - name: Test native 7-inch Midnight Home Dashboard
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_smart_home.py' -v
      - name: Validate Home Assistant configuration, safe commands and 800x480 screen
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_home_assistant.py' -v
      - name: Test Audio Visualizer Pro (real monitor only)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_audio_visualizer.py' -v
      - name: Test Bluetooth Auto-Reconnect 2.0 (no live device)
        run: .venv/bin/python -m unittest discover -s tests -p 'test_bluetooth_reconnect.py' -v
      - name: Test Smart Photo Frame Pro albums and transitions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_photo_frame_pro.py' -v
      - name: Check active player routing in PiRadio integration
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          source = Path("touch_radio.py").read_text()
          assert "def toggle_active_playback():" in source
          assert "video_mini_hit(event.pos, current_video_visual_status() or {})" in source
          assert "draw_video_mini(landscape_display" in source
          assert "video_backend.seek(10 if step > 0 else -10)" in source
          assert "vlc_source=\"youtube_audio\" if current_youtube_id() else \"radio\"" in source
          print("All active-source routing checks passed")
          PY
      - name: Test guest pairing security, casting and RTSP validation
        run: .venv/bin/python -m unittest discover -s tests -p 'test_guest_cast.py' -v
      - name: Render Cast PIN/QR screen
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import pygame
          from landscape_cast import draw_cast_page, draw_cast_button, CAST_BUTTON
          pygame.display.init()
          pygame.font.init()
          s = pygame.display.set_mode((800,480))
          s.fill((0,0,0))
          font=lambda n: pygame.font.Font(None,n)
          draw_cast_page(s,font(25),font(21),font(16),
              {"active":True,"pin":"504321","seconds_left":500},
              "http://192.168.1.25:8080/cast")
          draw_cast_button(s,font(20),active=True)
          assert s.get_at((180,180))[:3] != (0,0,0)
          assert CAST_BUTTON.collidepoint((700,20))
          pygame.image.save(s,"guest-cast-preview.png")
          print("Cast pairing QR rendering passed")
          PY
      - name: Test dedicated 7-inch YouTube audio player
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_youtube_dedicated_player.py' -v
      - name: Check YouTube route and search/player navigation
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          source = Path("touch_radio.py").read_text()
          search = Path("landscape_pages.py").read_text()
          required = (
              'active_page = "youtube_player"',
              'def youtube_player_state():',
              'draw_youtube_player(landscape_display',
              'youtube_player_hit(event.pos, youtube_player_state())',
              'youtube_player_open_requested = True',
              'player.set_time(int(plan.value * 1000))',
              'player_available=youtube_player_available()',
          )
          for marker in required:
              assert marker in source, marker
          assert '"NOW PLAYING"' in search
          assert '("youtube_player",)' in search
          print("YouTube audio-to-player navigation checks passed")
          PY
      - name: Render dedicated YouTube audio player preview
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import pygame
          from landscape_youtube_player import draw
          pygame.init()
          display = pygame.display.set_mode((800,480))
          display.fill((0,0,0))
          font=lambda size: pygame.font.Font(None,size)
          state = dict(
              mode="audio", playing=True, paused=False,
              title="Bayapadathey - Tamil Christian Worship",
              channel="Tamil Christian Music", position=61, duration=250,
              seekable=True, queue_total=10, queue_position=1
          )
          artwork=pygame.Surface((112,112))
          artwork.fill((95,95,95))
          draw(display,font(31),font(22),font(18),state,artwork)
          pygame.image.save(display,"youtube-dedicated-player-preview.png")
          print("Dedicated YouTube player preview created")
          PY
      - name: Test Smart Photo Frame photo uploads and touchscreen
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_smart_photo_frame.py' -v
      - name: Verify Photo Frame integration
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          source = Path("touch_radio.py").read_text()
          required = (
              "photo_frame_library = PhotoFrameLibrary()",
              "register_frame_routes(app, photo_frame_library)",
              "photo_frame_renderer.activate(now)",
              'if active_page == "photo_frame":',
              'url=f"http://{current_ip}:{web_port}/frame"',
              'photo_frame_library.options["auto_idle"]',
              "photo_frame_renderer.draw(",
          )
          for item in required:
              assert item in source, item
          print("Smart Photo Frame integration is wired to PiRadio 7")
          PY
      - name: Render 800x480 Smart Photo Frame preview
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import pygame
          from PIL import Image, ImageDraw
          import tempfile, time
          from pathlib import Path
          from smart_photo_frame import PhotoFrameLibrary, PhotoFrameRenderer
          pygame.init()
          screen=pygame.display.set_mode((800,480))
          with tempfile.TemporaryDirectory() as root:
              library=PhotoFrameLibrary(
                  Path(root)/"photos",Path(root)/"settings.json")
              # Test asset created programmatically; no outside image dependency.
              pic=Image.new("RGB",(1280,768),(31,55,69))
              draw=ImageDraw.Draw(pic)
              for i in range(0,1280,60):
                  draw.polygon([(i,480),(i+270,240),(i+540,480)],
                               fill=(20+i%80,85+i%40,111+i%80))
              draw.rectangle((0,490,1280,768),fill=(20,52,65))
              draw.ellipse((945,72,1120,247),fill=(239,206,137))
              pic.save(library.root/"sample.jpg")
              renderer=PhotoFrameRenderer(library)
              now=time.time()
              renderer.activate(now)
              renderer.show_pairing=False
              renderer.refresh(now)
              renderer.path=library.list_photos()[0]
              raw=pygame.image.fromstring(
                  pic.resize((800,480)).tobytes(),(800,480),"RGB")
              renderer.image=raw
              renderer.controls_until=now+10
              font=lambda n:pygame.font.Font(None,n)
              renderer.draw(screen,font(31),font(23),font(18),now,
                            city="Antwerp",temperature=19,
                            playing="PiRadio Music")
              pygame.image.save(screen,"smart-photo-frame-preview.png")
              renderer.show_pairing=True
              renderer.draw(screen,font(31),font(23),font(18),now,
                            city="Antwerp",temperature=19,
                            url="http://192.168.1.25:8080/frame")
              pygame.image.save(screen,"smart-photo-frame-pairing.png")
          print("Photo Frame and QR UI rendered")
          PY
      - name: Test fullscreen immersive menu, touch mapping and dock
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_immersive_navigation.py' -v
      - name: Check immersive navigation is integrated
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          source=Path("touch_radio.py").read_text()
          for item in (
              "immersive_layout(landscape_display)",
              "immersive_draw_dock(landscape_display",
              "immersion" if False else "immersive_dock_open",
              "to_source(actual_pos)",
              "SWIPE_START_Y",
              'active_page != "photo_frame"',
              "draw_cast_button(landscape_display",
          ):
              assert item in source, item
          print("Immersive dock and content touch mapping integrated")
          PY
      - name: Render immersive full-width radio and dock previews
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          .venv/bin/python - <<'PY'
          import pygame
          from landscape_dashboard import draw_dashboard
          from landscape_immersive import (
              layout,draw_topbar,draw_dock,
          )
          from landscape_cast import draw_cast_button
          from smart_photo_frame import FRAME_BUTTON
          pygame.init()
          s=pygame.display.set_mode((800,480))
          font=lambda n:pygame.font.Font(None,n)
          draw_dashboard(s,font(31),font(22),font(17),"radio",
              "Tamil Christian Radio","Worship Songs",True,
              False,False,"",54)
          layout(s)
          draw_topbar(s,font(31),font(22),font(17),"radio")
          draw_cast_button(s,font(22))
          pygame.draw.rect(s,(28,28,28),FRAME_BUTTON,border_radius=11)
          text=font(22).render("PHOTO",True,(246,246,246))
          s.blit(text,text.get_rect(center=FRAME_BUTTON.center))
          pygame.image.save(s,"immersive-piradio-player-preview.png")
          draw_dock(s,font(31),font(22),font(17),"radio")
          pygame.image.save(s,"immersive-piradio-dock-preview.png")
          print("Immersive 800x480 player and dock previews saved")
          PY
      - name: Render screensaver smoke test
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import pygame
          from landscape_screensaver import draw

          pygame.display.init()
          pygame.font.init()
          surface = pygame.display.set_mode((800, 480))
          def font(size, bold=False):
              return pygame.font.Font(None, size)
          fonts = {
              "clock": font(145),
              "temperature": font(54),
              "date": font(23),
              "medium": font(22),
              "label": font(16),
              "small": font(17),
          }
          def weather_icon(surface, x, y, kind, size, dimmed, on_background):
              pygame.draw.circle(surface, (160, 190, 240), (x, y), size // 2)
          draw(
              surface, fonts, 1794282000, "cloud", 8, "Mortsel",
              [{"high": 11, "low": 4}], 76, "Radio • A sample with a long Tamil Bible title",
              "06:30", weather_icon,
          )
          from landscape_screensaver import WHITE, WEATHER_CYAN, BLACK
          assert tuple(surface.get_at((0, 0))[:3]) == BLACK
          assert tuple(surface.get_at((790, 470))[:3]) == BLACK
          assert any(tuple(surface.get_at((x, y))[:3]) == WHITE
                     for y in range(140, 260, 2) for x in range(50, 485, 2)), "White clock missing"
          assert any(tuple(surface.get_at((x, y))[:3]) == WEATHER_CYAN
                     for y in range(154, 220) for x in range(610, 760)), "Cyan temperature missing"
          pygame.image.save(surface, "screensaver-preview.png")
          source = Path("touch_radio.py").read_text(encoding="utf-8")
          assert 'SCREENSAVER_TIMEOUT_SECONDS = 120' in source
          assert 'if youtube_video.is_playing():' in source
          assert 'if saver_active and not youtube_video.is_playing():' in source
          assert 'saver_wake_ignore_up = True' in source
          print("800x480 render and auto-activation integration checks passed")
          PY
      - name: Attach immersive menu preview
        uses: actions/upload-artifact@v4
        with:
          name: seven-inch-immersive-menu-preview
          path: |
            immersive-piradio-player-preview.png
            immersive-piradio-dock-preview.png
      - name: Attach Smart Photo Frame previews
        uses: actions/upload-artifact@v4
        with:
          name: seven-inch-smart-photo-frame-preview
          path: |
            smart-photo-frame-preview.png
            smart-photo-frame-pairing.png
      - name: Attach YouTube player preview
        uses: actions/upload-artifact@v4
        with:
          name: seven-inch-youtube-player-preview
          path: youtube-dedicated-player-preview.png
      - name: Attach guest Cast pairing preview
        uses: actions/upload-artifact@v4
        with:
          name: seven-inch-guest-cast-preview
          path: guest-cast-preview.png
      - name: Attach optional visual preview
        uses: actions/upload-artifact@v4
        with:
          name: seven-inch-screensaver-preview
          path: screensaver-preview.png
