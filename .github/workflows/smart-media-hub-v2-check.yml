name: PiRadio 7 Smart Media Hub V2 - safe media snapshot

on:
  push:
    branches:
      - feature/7inch-smart-media-hub-v2
    paths:
      - 'media_session.py'
      - 'media_transport.py'
      - 'video_cinema.py'
      - 'youtube_video_backend.py'
      - 'tests/test_video_cinema.py'
      - 'youtube_video_backend.py'
      - 'tests/test_media_transport.py'
      - 'touch_radio.py'
      - 'tests/test_media_session.py'
      - '.github/workflows/smart-media-hub-v2-check.yml'
  pull_request:
    paths:
      - 'media_session.py'
      - 'media_transport.py'
      - 'video_cinema.py'
      - 'youtube_video_backend.py'
      - 'tests/test_video_cinema.py'
      - 'youtube_video_backend.py'
      - 'tests/test_media_transport.py'
      - 'touch_radio.py'
      - 'tests/test_media_session.py'
      - '.github/workflows/smart-media-hub-v2-check.yml'
  workflow_dispatch:

jobs:
  media-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax without Raspberry Pi hardware
        run: python -m py_compile media_session.py media_transport.py video_cinema.py youtube_video_backend.py touch_radio.py
      - name: Test active media source priority
        run: python -m unittest discover -s tests -p 'test_media_session.py' -v
      - name: Validate unified transport command planning
        run: python -m unittest discover -s tests -p 'test_media_transport.py' -v
      - name: Test Cinema timeline, buffering and remote state
        run: python -m unittest discover -s tests -p 'test_video_cinema.py' -v
      - name: Validate phone Cinema JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('touch_radio.py').read_text()
          opening = '<script>' + chr(10) + 'let piVideoSeeking=false;'
          assert opening in source
          source_after = source.split(opening, 1)[1]
          cinema_script = 'let piVideoSeeking=false;' + source_after.split('</script>', 1)[0]
          Path('/tmp/piradio-cinema-remote.js').write_text(cinema_script)
          PY
          node --check /tmp/piradio-cinema-remote.js
      - name: Verify backwards-compatible remote routes
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('touch_radio.py').read_text()
          assert "from media_session import resolve_media_snapshot" in source
          assert "def active_media_snapshot():" in source
          assert "@app.route('/api/media/session')" in source
          assert "@app.route('/api/nowplaying')" in source
          assert "@app.route('/api/status')" in source
          assert "return jsonify(active_media_snapshot().as_dict())" in source
          assert "def control_active_media(" in source
          assert "from media_transport import plan_media_command" in source
          assert 'control_active_media("next")' in source
          assert 'control_active_media("prev")' in source
          print("Playback integration and existing endpoints confirmed")
          PY
