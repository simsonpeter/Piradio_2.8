<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TC RADIOS Touchscreen Simulator</title>
<style>
:root{--bg:#000;--surface:#0f1219;--raised:#181c26;--text:#f1f5ff;--muted:#787e8c;--blue:#32cdff;--purple:#915cff;--amber:#ffc14a;--green:#36de9f;--pink:#ff5394}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10131b;color:var(--text);font-family:Inter,Arial,sans-serif;display:grid;place-items:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}.toolbar{width:min(94vw,520px);display:flex;justify-content:space-between;align-items:center;color:#c8d0df;font-size:13px}.toolbar button{border:1px solid #3c475b;background:#202735;color:#fff;border-radius:10px;padding:9px 14px}
.device{width:320px;height:480px;overflow:hidden;position:relative;border-radius:20px;background:linear-gradient(180deg,var(--bg),#07070a);box-shadow:0 18px 60px #0009;border:1px solid #39445a;touch-action:none;user-select:none}
.screen{position:absolute;inset:0;padding:7px 8px 10px;background:radial-gradient(circle at 90% 20%,color-mix(in srgb,var(--blue) 8%,transparent),transparent 32%),radial-gradient(circle at 5% 80%,color-mix(in srgb,var(--purple) 9%,transparent),transparent 37%)}
.header{height:52px;border:1px solid #364b70;background:var(--surface);border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin:13px 8px 0}.card,.button,.row{border:1px solid #30384a;background:var(--raised);color:var(--text);border-radius:15px;cursor:pointer}.card{height:75px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:12px;font-weight:800}.card:nth-child(3n+1){border-color:var(--blue)}.card:nth-child(3n+2){border-color:var(--purple)}.card:nth-child(3n){border-color:var(--amber)}.card small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:9px}
.footer{position:absolute;left:70px;right:70px;bottom:12px;height:38px;border:1px solid var(--blue);background:var(--raised);border-radius:16px;display:grid;place-items:center;font-size:12px;font-weight:800;cursor:pointer}
.section{font-size:12px;font-weight:800;margin:14px 10px 8px}.hero{margin:13px 6px;border:1px solid var(--blue);background:var(--raised);border-radius:18px;padding:16px;text-align:center}.hero .big{font-size:42px;font-weight:800}.muted{color:var(--muted);font-size:10px}.rows{display:flex;flex-direction:column;gap:6px;margin:8px 10px}.row{min-height:45px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.row b{font-size:12px}.row small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px}.button{min-height:42px;display:grid;place-items:center;font-size:10px;font-weight:800}.button.active{border-color:var(--green);color:var(--green)}.button.primary{border-color:var(--blue)}.button.danger{border-color:var(--pink)}
.art{width:112px;height:112px;border-radius:50%;border:2px solid var(--blue);background:linear-gradient(135deg,#19273d,#38245a);margin:14px auto;display:grid;place-items:center;font-size:30px;font-weight:900}.title{text-align:center;font-size:18px;font-weight:800;padding:8px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.volume{margin:14px 18px;height:18px;background:#252f44;border-radius:9px;overflow:hidden}.volume i{display:block;height:100%;width:80%;background:var(--blue)}
.wide{grid-column:1/-1}.languages{grid-template-rows:repeat(4,70px)}.language-stations .row{height:46px}.pager{display:grid;grid-template-columns:88px 1fr 88px;gap:8px;margin:10px}.pager span{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.settings-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 6px}.settings-grid .button{height:60px}.wifi{margin:8px 10px;padding:14px;border:1px solid var(--purple);border-radius:16px;background:var(--raised);display:flex;justify-content:space-between;align-items:center}.theme-picker{display:grid;grid-template-columns:50px 1fr 50px;gap:10px;margin:8px 10px}.theme-picker .button{height:63px}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 10px}.status-grid .card{height:110px;align-items:flex-start;padding:14px}.status-grid .card b{font-size:15px;margin-top:12px}.toast{position:absolute;left:20px;right:20px;bottom:62px;background:#212838;border:1px solid var(--blue);padding:10px;border-radius:12px;text-align:center;font-size:11px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
.hint{font-size:12px;color:#8993a6;text-align:center}.spinner{width:22px;height:22px;border:3px solid #445;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-height:560px){.stage{padding:4px}.toolbar{display:none}.device{border-radius:0}}
</style>
</head>
<body>
<div class="stage">
  <div class="toolbar"><span>TC RADIOS interactive preview — simulated only</span><button id="reset">Reset</button></div>
  <div class="device" id="device"><div class="screen" id="screen"></div><div class="toast" id="toast"></div></div>
  <div class="hint">Tap controls or swipe horizontally. No real radio settings are changed.</div>
</div>
<script>
const languageBase='https://raw.githubusercontent.com/simsonpeter/Tcradios/8d31b80bed64167d2887313baf5b3bb12879308d/languages';
const languageUrls={Tamil:'https://raw.githubusercontent.com/simsonpeter/Tcradios/refs/heads/main/stations.json',Kannada:`${languageBase}/Kannada.json`,Dutch:`${languageBase}/dutch.json`,English:`${languageBase}/english.json`,Hindi:`${languageBase}/hindi.json`,Malayalam:`${languageBase}/malayalam.json`,Sinhala:`${languageBase}/sinhala.json`,Telugu:`${languageBase}/telugu.json`};
const pages=['radio','favorites','forecast','clock','alarm','system','languages','settings'];
const themes=[
  {name:'True Black',vars:['#000','#32cdff','#915cff','#ffc14a']},
  {name:'Ocean Blue',vars:['#061426','#00d2ff','#1e90ff','#ff6b6b']},
  {name:'Purple Night',vars:['#0d0617','#bb6cff','#6847ff','#ffbd3f']},
  {name:'Forest',vars:['#06120d','#39e39b','#3aaad9','#f3bc4f']}
];
const model={page:'menu',station:'FGPC FM',playing:true,volume:80,favorites:['FGPC FM','1000 Praises','Adonai','Amen FM'],alarm:true,alarmTime:'07:00',sleep:0,output:'Auto',theme:0,forecast:[],language:null,languagePage:0,languageCache:{},bluetooth:[],bluetoothBusy:false};
const screen=document.getElementById('screen'),toast=document.getElementById('toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const header=t=>`<div class="header">${esc(t)}</div>`;
const footer=(label='PAGES',target='menu')=>`<div class="footer" data-page="${target}">${label}</div>`;
const showToast=text=>{toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)};
function render(){
  const fn={menu,radio,favorites,forecast,clock,alarm,system,languages,languageStations,settings,bluetooth}[model.page]||menu;
  screen.innerHTML=fn();
}
function menu(){
  const cards=[['radio','NOW PLAYING','Radio controls'],['favorites','FAVORITES','Quick stations'],['forecast','FORECAST','Five days'],['clock','CLOCK','Time dashboard'],['alarm','ALARM / SLEEP','Timers'],['system','SYSTEM','Pi status'],['languages','LANGUAGES','More streams'],['settings','SETTINGS','Sound • Wi-Fi • Themes']];
  return header('TC RADIOS')+`<div class="grid">${cards.map(c=>`<div class="card" data-page="${c[0]}">${c[1]}<small>${c[2]}</small></div>`).join('')}</div>`;
}
function radio(){
  return header('TC RADIOS')+`<div class="art">FG</div><div class="title">${esc(model.station)}</div><div class="muted" style="text-align:center">Internet Radio</div><div class="volume"><i style="width:${model.volume}%"></i></div><div class="controls"><div class="button" data-action="prev">PREV</div><div class="button primary" data-action="toggle">${model.playing?'PAUSE':'PLAY'}</div><div class="button" data-action="next">NEXT</div></div>`+footer();
}
function favorites(){
  return header('FAVORITES')+`<div class="controls"><div class="button wide primary" data-action="favorite">ADD CURRENT</div></div><div class="grid">${model.favorites.slice(0,6).map((s,i)=>`<div class="card" data-station="${esc(s)}">${i+1}<small>${esc(s)}</small></div>`).join('')}</div>`+footer();
}
function forecast(){
  const rows=(model.forecast.length?model.forecast:[['SAT','Cloudy','19° / 13°'],['SUN','Partly cloudy','19° / 14°'],['MON','Clear','19° / 12°'],['TUE','Cloudy','19° / 8°'],['WED','Drizzle','15° / 11°']]);
  return header('5-DAY FORECAST')+`<div class="hero"><div class="big">18°C</div><div class="muted">HOVE • NOW</div></div><div class="rows">${rows.map(r=>`<div class="row"><span><b>${r[0]}</b><small>${r[1]}</small></span><b>${r[2]}</b></div>`).join('')}</div>`+footer();
}
function clock(){
  const now=new Date();return header('CLOCK')+`<div style="text-align:center;font-size:62px;font-weight:900;margin-top:28px">${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div style="text-align:center;color:var(--blue);font-size:22px;font-weight:800;margin-top:20px">${now.toLocaleDateString([],{weekday:'long'}).toUpperCase()}</div><div class="muted" style="text-align:center;margin:12px">${now.toLocaleDateString([],{day:'2-digit',month:'long',year:'numeric'})}</div><div class="hero"><div class="big" style="font-size:34px">18°C</div><div class="muted">HOVE</div></div>`+footer();
}
function alarm(){
  return header('ALARM & SLEEP')+`<div class="hero"><div class="big">${model.alarmTime}</div><b style="color:${model.alarm?'var(--amber)':'var(--muted)'}">${model.alarm?'ALARM ON':'ALARM OFF'}</b></div><div class="controls"><div class="button" data-action="alarm-">− 5 MIN</div><div class="button primary" data-action="alarmToggle">ON / OFF</div><div class="button" data-action="alarm+">+ 5 MIN</div></div><div class="section">SLEEP TIMER</div><div class="controls">${[15,30,60].map(n=>`<div class="button ${model.sleep===n?'active':''}" data-sleep="${n}">${n} MIN</div>`).join('')}</div><div class="controls"><div class="button wide danger" data-action="sleepCancel">${model.sleep?`${model.sleep} MIN REMAINING`:'TIMER OFF'}</div></div>`+footer();
}
function system(){
  const values=[['WI-FI','86%'],['IP ADDRESS','192.168.1.81'],['CPU','48°C'],['STORAGE','21.4 GB free']];
  return header('SYSTEM STATUS')+`<div class="status-grid">${values.map(v=>`<div class="card"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('')}</div><div class="wifi"><span><b>BLUETOOTH AUDIO</b><br><small class="muted">S5-SPEAKER</small></span></div>`+footer();
}
function languages(){
  return header('LANGUAGES')+`<div class="grid languages">${Object.keys(languageUrls).map(l=>`<div class="card" data-language="${l}">${l.toUpperCase()}</div>`).join('')}</div>`+footer();
}
function languageStations(){
  const all=model.languageCache[model.language]||[],start=model.languagePage*5,visible=all.slice(start,start+5),pages=Math.max(1,Math.ceil(all.length/5));
  if(!all.length)return header(model.language||'LANGUAGE')+`<div class="hero" style="margin-top:70px"><div class="spinner"></div><div class="muted" style="margin-top:14px">Loading stations…</div></div>`+footer('&lt; LANGUAGES','languages');
  return header(model.language.toUpperCase())+`<div class="rows language-stations">${visible.map((s,i)=>`<div class="row" data-language-station="${start+i}"><span><b>${esc(s.name)}</b><small>${esc(s.genre||`${model.language} Radio`)}</small></span></div>`).join('')}</div><div class="pager"><div class="button" data-action="langPrev">PREV</div><span>${model.languagePage+1} / ${pages}</span><div class="button" data-action="langNext">NEXT</div></div>`+footer('&lt; LANGUAGES','languages');
}
function settings(){
  return header('SETTINGS')+`<div class="section">SOUND OUTPUT</div><div class="settings-grid">${['Auto','Jack','HDMI','Bluetooth'].map(o=>`<div class="button ${model.output===o?'active':''}" data-output="${o}">${o.toUpperCase()}</div>`).join('')}</div><div class="section">WI-FI CONNECTION</div><div class="wifi"><span><b>Signal 86%</b><br><small class="muted">192.168.1.81</small></span><div class="button primary" data-action="wifi">WEB / QR</div></div><div class="section">THEME</div><div class="theme-picker"><div class="button" data-action="themePrev">&lt;</div><div class="button active">${themes[model.theme].name.toUpperCase()}</div><div class="button" data-action="themeNext">&gt;</div></div>`+footer();
}
function bluetooth(){
  const body=model.bluetoothBusy?`<div class="hero" style="margin-top:70px"><div class="spinner"></div></div>`:model.bluetooth.length?`<div class="rows">${model.bluetooth.map((d,i)=>`<div class="row" data-bt="${i}"><span><b>${d.name}</b><small>${d.connected?'CONNECTED':d.paired?'PAIRED • TAP TO CONNECT':'AVAILABLE • TAP TO PAIR'}</small></span></div>`).join('')}</div>`:`<div class="hero" style="margin-top:55px;height:225px;display:grid;place-items:center"><span class="muted">No devices loaded</span></div>`;
  return header('BLUETOOTH')+`<div class="controls"><div class="button wide primary" data-action="btSearch">${model.bluetoothBusy?'SEARCHING…':'SEARCH DEVICES'}</div></div>${body}`+footer('&lt; SETTINGS','settings');
}
async function loadLanguage(language){
  model.language=language;model.languagePage=0;model.page='languageStations';render();
  if(!model.languageCache[language]){try{const data=await fetch(languageUrls[language]).then(r=>r.json()),seen=new Set();model.languageCache[language]=data.filter(s=>{s.url=(s.url||'').trim();if(!s.name||!s.url||seen.has(s.url))return false;seen.add(s.url);return true})}catch{model.languageCache[language]=[{name:'Unable to load catalog',genre:'Check internet connection',url:''}]}}
  render();
}
function adjustAlarm(delta){const [h,m]=model.alarmTime.split(':').map(Number),d=new Date(2000,0,1,h,m+delta);model.alarmTime=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function applyTheme(){const t=themes[model.theme];document.documentElement.style.setProperty('--bg',t.vars[0]);document.documentElement.style.setProperty('--blue',t.vars[1]);document.documentElement.style.setProperty('--purple',t.vars[2]);document.documentElement.style.setProperty('--amber',t.vars[3])}
screen.addEventListener('click',e=>{
  const el=e.target.closest('[data-page],[data-action],[data-station],[data-sleep],[data-language],[data-language-station],[data-output],[data-bt]');if(!el)return;
  if(el.dataset.page){model.page=el.dataset.page;render();return}
  if(el.dataset.station){model.station=el.dataset.station;model.page='radio';showToast(`Playing ${model.station}`);render();return}
  if(el.dataset.sleep){model.sleep=Number(el.dataset.sleep);render();return}
  if(el.dataset.language){loadLanguage(el.dataset.language);return}
  if(el.dataset.languageStation!==undefined){const s=model.languageCache[model.language][Number(el.dataset.languageStation)];if(s.url){model.station=s.name;model.page='radio';showToast(`Playing ${s.name}`);render()}return}
  if(el.dataset.output){if(el.dataset.output==='Bluetooth'){model.page='bluetooth'}else{model.output=el.dataset.output;showToast(`${model.output} selected`)}render();return}
  if(el.dataset.bt!==undefined){model.bluetooth.forEach(d=>d.connected=false);model.bluetooth[Number(el.dataset.bt)].connected=true;model.output='Bluetooth';showToast(`Connected to ${model.bluetooth[Number(el.dataset.bt)].name}`);render();return}
  const a=el.dataset.action;
  if(a==='toggle')model.playing=!model.playing;
  if(a==='prev'||a==='next')showToast(`${a==='next'?'Next':'Previous'} station`);
  if(a==='favorite'&&!model.favorites.includes(model.station))model.favorites.unshift(model.station);
  if(a==='alarmToggle')model.alarm=!model.alarm;
  if(a==='alarm-')adjustAlarm(-5);if(a==='alarm+')adjustAlarm(5);
  if(a==='sleepCancel')model.sleep=0;
  if(a==='langPrev')model.languagePage=Math.max(0,model.languagePage-1);
  if(a==='langNext')model.languagePage=Math.min(Math.ceil(model.languageCache[model.language].length/5)-1,model.languagePage+1);
  if(a==='themePrev')model.theme=(model.theme-1+themes.length)%themes.length;
  if(a==='themeNext')model.theme=(model.theme+1)%themes.length;
  if(a==='themePrev'||a==='themeNext')applyTheme();
  if(a==='wifi')showToast('Connection QR opened in the real app');
  if(a==='btSearch'){model.bluetoothBusy=true;render();setTimeout(()=>{model.bluetoothBusy=false;model.bluetooth=[{name:'S5-SPEAKER',paired:true},{name:'JBL GO 4',paired:true},{name:'Kitchen Speaker',paired:false}];render()},1000);return}
  render();
});
let startX=0,startY=0,startAt=0;
screen.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;startAt=Date.now()});
screen.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(pages.includes(model.page)&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)&&Date.now()-startAt<2500){const i=pages.indexOf(model.page);model.page=pages[(i+(dx<0?1:-1)+pages.length)%pages.length];render()}});
document.getElementById('reset').onclick=()=>{location.reload()};
setInterval(()=>{if(model.page==='clock')render()},1000);
fetch('https://api.open-meteo.com/v1/forecast?latitude=50.83&longitude=-0.17&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto').then(r=>r.json()).then(d=>{model.forecast=d.daily.time.map((x,i)=>[new Date(`${x}T12:00:00`).toLocaleDateString([],{weekday:'short'}).toUpperCase(),d.daily.weather_code[i]===0?'Clear':d.daily.weather_code[i]<50?'Cloudy':'Rain',`${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°`]);if(model.page==='forecast')render()}).catch(()=>{});
render();
</script>
</body>
</html>
